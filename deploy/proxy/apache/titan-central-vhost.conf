# Titan Central reverse proxy: Apache include for the Central vhost (DirectAdmin custom httpd block).
# Replace __CENTRAL_PORT__ with the loopback port of TITAN_CENTRAL_PORT, and __CALLBACK_CONCURRENT_LIMIT__
# and __ACCESS_CONCURRENT_LIMIT__ with operator-chosen values.
#
# MODULE CHOICE: mod_qos. It is third-party (not in stock Apache) and is chosen because it can scope a
# limit to a URL regex per client IP. mod_ratelimit is NOT suitable (it limits bandwidth, not requests).
# mod_evasive was not chosen because it blocks by global per-IP request thresholds rather than per route.
#
# CAVEATS (unverified here):
#  - Nothing was installed in the build environment, so these directive names and the status code mod_qos
#    returns were NOT tested against a running Apache. QS_LocRequestLimitMatch is a concurrency cap per IP
#    per location in mod_qos, not a requests-per-second rate. Confirm the module's behaviour with apachectl -t
#    and the burst test in deploy/proxy/README.md before relying on it.
#  - If the host cannot return 429 from mod_qos, use the nginx templates instead.
#  - DirectAdmin regenerates vhost files. Put this text only in the custom httpd block, never in the generated file.
#  - LoadModule for mod_qos must be in the global configuration, not in this include.

# Overwrite client-supplied forwarding headers. The app trusts only what the socket says.
RequestHeader unset X-Forwarded-For
RequestHeader unset X-Real-IP
RequestHeader unset Forwarded
ProxyAddHeaders On

# Operator-only admin API is not published through the public proxy.
RedirectMatch 404 ^/v1/admin/

ProxyPassMatch "^/v1/access/check$" "http://127.0.0.1:__CENTRAL_PORT__/v1/access/check"
ProxyPassMatch "^/auth/titan/(field|desk|academy)/(start|callback)$" "http://127.0.0.1:__CENTRAL_PORT__/auth/titan/$1/$2"

QS_LocRequestLimitMatch "^/v1/access/check$" __ACCESS_CONCURRENT_LIMIT__
QS_LocRequestLimitMatch "^/auth/titan/(field|desk|academy)/callback$" __CALLBACK_CONCURRENT_LIMIT__

# Browser routes are separate from product-owned OIDC callbacks. The
# operator MUST verify that mod_qos returns HTTP 429 under saturation.
ProxyPassMatch "^/auth/central/(start|callback|select)$" "http://127.0.0.1:__CENTRAL_PORT__/auth/central/$1"
QS_LocRequestLimitMatch "^/auth/central/(start|callback|select)$" __CALLBACK_CONCURRENT_LIMIT__
QS_LocRequestLimitMatch "^/auth/titan/(field|desk|academy)/start$" __CALLBACK_CONCURRENT_LIMIT__
