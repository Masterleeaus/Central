# Titan Central reverse proxy: nginx zones (http{} context).
# Include this file inside the http{} block of the nginx.conf that serves the Central host
# (on DirectAdmin this is usually the custom nginx include point; see deploy/proxy/README.md).
#
# Keys are the socket address nginx sees ($binary_remote_addr). Never key on a client-supplied header.
# Zones are per nginx worker set and reset on reload; they are not shared across servers.

limit_req_zone $binary_remote_addr zone=titan_access:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=titan_oidc_callback:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=titan_oidc_start:10m rate=4r/s;
limit_req_zone $binary_remote_addr zone=titan_company_select:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=titan_conn:10m;

# Rejected requests get 429 instead of nginx's default 503.
limit_req_status 429;
limit_conn_status 429;
