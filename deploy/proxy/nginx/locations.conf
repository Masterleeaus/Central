# Titan Central reverse proxy: nginx locations (server{} context of the Central vhost).
# Requires the zones in nginx/zones.conf to be loaded in http{}.
# Replace __CENTRAL_PORT__ with the loopback port the Central API listens on (TITAN_CENTRAL_PORT).
# The Central API binds 127.0.0.1 only; this proxy is the only public path to it.
#
# Each proxied location OVERWRITES X-Forwarded-For from the real socket address and clears
# Forwarded, so client-supplied forwarding headers never reach the app.

location = /v1/access/check {
    limit_req zone=titan_access burst=40 nodelay;
    limit_conn titan_conn 20;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:__CENTRAL_PORT__;
}

location ~ ^/auth/titan/(field|desk|academy)/callback$ {
    limit_req zone=titan_oidc_callback burst=10 nodelay;
    limit_conn titan_conn 10;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:__CENTRAL_PORT__;
}

location ~ ^/auth/titan/(field|desk|academy)/start$ {
    limit_req zone=titan_oidc_start burst=12 nodelay;
    limit_conn titan_conn 10;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:__CENTRAL_PORT__;
}

# Admin API is operator-only. It is not published through the public proxy by default.
# Removing this block is a deliberate decision that must be reviewed, not a default.
location ^~ /v1/admin/ {
    return 404;
}

# First-party Titan Central browser authentication and explicit company choice.
location ~ ^/auth/central/(start|callback)$ {
    limit_req zone=titan_oidc_callback burst=10 nodelay;
    limit_conn titan_conn 10;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:__CENTRAL_PORT__;
}
location = /auth/central/select {
    limit_req zone=titan_company_select burst=8 nodelay;
    limit_conn titan_conn 6;
    client_max_body_size 4k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Forwarded "";
    proxy_pass http://127.0.0.1:__CENTRAL_PORT__;
}
