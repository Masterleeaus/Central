name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
          POSTGRES_DB: titan_central
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TITAN_CI_DATABASE_URL: postgresql://postgres:ci-only-throwaway@localhost:5432/titan_central
    steps:
      - uses: actions/checkout@v4 # major-version pin only
      - uses: actions/setup-node@v4 # major-version pin only
        with:
          node-version: 22
      - uses: actions/setup-python@v5 # major-version pin only
        with:
          python-version: '3.13'

      # Dependencies come only from the committed lockfiles.
      - name: Install control-api dependencies
        working-directory: apps/control-api
        run: npm ci
      - name: Install control-plane dependencies
        working-directory: packages/control-plane
        run: npm ci

      # Build to a scratch directory and fail if the committed dist/ differs.
      # Rebuild with: (cd packages/control-plane && npx tsc -p tsconfig.json)
      - name: Build control-plane (tsc, scratch output)
        working-directory: packages/control-plane
        run: npx tsc -p tsconfig.json --outDir "$RUNNER_TEMP/dist-fresh"
      - name: Fail if committed control-plane dist is stale
        working-directory: packages/control-plane
        run: |
          if ! diff -r dist "$RUNNER_TEMP/dist-fresh"; then
            echo "packages/control-plane/dist does not match a fresh build. Run: cd packages/control-plane && npx tsc -p tsconfig.json"
            exit 1
          fi

      - name: control-plane tests
        working-directory: packages/control-plane
        run: node --test test/*.test.mjs
      - name: control-api tests
        working-directory: apps/control-api
        run: node --test test/*.test.mjs

      - name: Python tests (deploy)
        run: python3 -m unittest discover -s deploy/tests -p 'test_*.py' -v
      - name: Python tests (tools and migration runner)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      # Check mode: the example config must parse and be assessed as NOT ready (exit 1).
      # Exit 2 (unreadable) or 0 (ready) fails the job.
      - name: Preflight check mode
        run: |
          set +e
          python3 deploy/preflight.py --config deploy/staging.example.json > "$RUNNER_TEMP/preflight.json"
          rc=$?
          set -e
          if [ "$rc" -ne 1 ]; then
            echo "preflight exited $rc; expected 1 (example config is not ready)"
            cat "$RUNNER_TEMP/preflight.json"
            exit 1
          fi
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["ready"] is False' "$RUNNER_TEMP/preflight.json"

      # Database: fresh schema, idempotent re-run, then two-tenant RLS. Any cross-tenant success fails.
      - name: Apply migrations to a fresh database
        run: python3 tools/migrate.py --database-url "$TITAN_CI_DATABASE_URL"
      - name: Re-running migrations applies nothing
        run: |
          out=$(python3 tools/migrate.py --database-url "$TITAN_CI_DATABASE_URL")
          echo "$out"
          test "$out" = "applied 0 migration(s)"
      - name: Two-tenant RLS tests
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/rls_two_tenant.sql "$TITAN_CI_DATABASE_URL"

      - name: Browser-session role isolation and atomic deletion
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_browser_sessions.sql "$TITAN_CI_DATABASE_URL"

      - name: Central OIDC state isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_oidc_state_isolation.sql "$TITAN_CI_DATABASE_URL"

      - name: Scoped company discovery and membership isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_company_discovery.sql "$TITAN_CI_DATABASE_URL"

      - name: Durable company selection role isolation and one-use consumption
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_company_selection.sql "$TITAN_CI_DATABASE_URL"

      - name: Central browser session access-reduction revocation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_session_access_revocation.sql "$TITAN_CI_DATABASE_URL"

      - name: Locked Central session issuance and revocation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/central_authorised_issue.sql "$TITAN_CI_DATABASE_URL"

      # Shared company core is an independent draft migration chain. Never run
      # it in the legacy Central DB: both chains define titan.identities
      # differently. CI uses a second disposable PostgreSQL database.
      - name: Create independent shared-core test database
        run: psql -X -v ON_ERROR_STOP=1 "$TITAN_CI_DATABASE_URL" -c "CREATE DATABASE titan_shared_ci"
      - name: Apply canonical migration registry 0001–0004
        run: python3 tools/migrate_shared.py --database-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"
      - name: Canonical migration rerun applies nothing
        run: |
          out=$(python3 tools/migrate_shared.py --database-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci")
          echo "$out"
          test "$out" = "applied 0 canonical migration(s)"
      - name: Verify canonical checksum registry and legacy schema absence
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_migration_registry.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"
      - name: Canonical runner refuses legacy Central database
        run: |
          if python3 tools/migrate_shared.py --database-url "$TITAN_CI_DATABASE_URL" > "$RUNNER_TEMP/shared-legacy-guard.txt" 2>&1; then
            echo "SECURITY FAILURE: shared runner accepted a legacy database"
            exit 1
          fi
          grep -q "existing legacy or unknown schema: migration refused" "$RUNNER_TEMP/shared-legacy-guard.txt"
      - name: Validate canonical companies and product IDs
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_company_core.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"

      - name: Verify canonical two-company isolation and links
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_company_rls.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"

      - name: Verify pending and cross-tenant company links deny access
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_company_legacy_mapping.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"

      - name: Check exact Logto legacy mapping with canonical RLS
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_company_verified_lookup.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"

      - name: Seed separate read-only reconciliation fixtures
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reconcile_legacy_fixture.sql "$TITAN_CI_DATABASE_URL"
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/reconcile_canonical_fixture.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"
      - name: Audit matching verified company, identity, membership and entitlement records
        run: |
          python3 tools/audit_company_reconciliation.py \
            --legacy-url "$TITAN_CI_DATABASE_URL" \
            --canonical-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" \
            --output "$RUNNER_TEMP/reconciliation-matched.json"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["blocker_count"]==0 and not r["migration_authorised"]' "$RUNNER_TEMP/reconciliation-matched.json"
      - name: Rehearse canonical backfill and prove transactional rollback
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/shared_backfill_rollback.sql "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci"
      - name: Plan deterministic backfill from verified database snapshots without writes
        run: |
          python3 tools/plan_company_backfill.py \
            --legacy-url "$TITAN_CI_DATABASE_URL" \
            --canonical-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" > "$RUNNER_TEMP/backfill-review.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["conflict_count"]==0 and all(v==0 for v in p["candidate_counts"].values()) and p["status"]=="candidate_review_only" and p["writes_permitted"] is False and p["migration_authorised"] is False' "$RUNNER_TEMP/backfill-review.json"
      - name: Audit must block altered member role without leaking private IDs
        run: |
          psql -X -v ON_ERROR_STOP=1 "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" -c "UPDATE titan.company_memberships SET role='learner' WHERE company_id='00000000-0000-4000-8000-000000000011'"
          set +e
          python3 tools/audit_company_reconciliation.py \
            --legacy-url "$TITAN_CI_DATABASE_URL" \
            --canonical-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" \
            --output "$RUNNER_TEMP/reconciliation-blocked.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["blockers"]["membership_access_mismatch"]==1; assert "audit-person" not in str(r) and not r["migration_authorised"]' "$RUNNER_TEMP/reconciliation-blocked.json"

      - name: Audit must detect entitlement expiry extension
        run: |
          psql -X -v ON_ERROR_STOP=1 "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" -c "UPDATE titan.company_memberships SET role='owner' WHERE company_id='00000000-0000-4000-8000-000000000011'"
          psql -X -v ON_ERROR_STOP=1 "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" -c "UPDATE titan.application_entitlements SET expires_at='2027-01-01T00:00:00Z' WHERE company_id='00000000-0000-4000-8000-000000000011'"
          set +e
          python3 tools/audit_company_reconciliation.py \
            --legacy-url "$TITAN_CI_DATABASE_URL" \
            --canonical-url "postgresql://postgres:ci-only-throwaway@localhost:5432/titan_shared_ci" \
            --output "$RUNNER_TEMP/reconciliation-expiry-blocked.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["blockers"]["entitlement_expiry_mismatch"]==1 and r["snapshots_consistent_within_each_database"] and not r["migration_authorised"]' "$RUNNER_TEMP/reconciliation-expiry-blocked.json"

      - name: Canonical cutover preflight blocks without independently approved evidence
        run: |
          set +e
          python3 tools/plan_company_cutover.py \
            --reconciliation "$RUNNER_TEMP/reconciliation-matched.json" \
            --output "$RUNNER_TEMP/cutover-preflight.json"
          rc=$?
          set -e
          test "$rc" -eq 2
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["status"]=="blocked" and not p["migration_authorised"] and not p["writes_permitted"] and len(p["missing_gates"])>=7' "$RUNNER_TEMP/cutover-preflight.json"
